# Argo CD Application: GitLab root/scraper-api-deploy 의 overlay 를 각 네임스페이스에 자동 동기화
#  - automated.prune    : Git 에서 지운 리소스는 클러스터에서도 삭제
#  - automated.selfHeal : 클러스터에서 손으로 바꾼 것은 Git 상태로 되돌림
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scraper-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab.cicd.svc.cluster.local/root/scraper-api-deploy.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: scraper-api-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scraper-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab.cicd.svc.cluster.local/root/scraper-api-deploy.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: scraper-api-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
