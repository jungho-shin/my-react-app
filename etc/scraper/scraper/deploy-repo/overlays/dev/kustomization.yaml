# dev 환경: scraper-dev 네임스페이스, 1개, http://192.168.45.116:8280/scraper/
# newTag 는 Jenkins(ci/update-deploy.sh dev)가 자동으로 변경한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scraper-dev
resources:
  - ../../base
images:
  - name: scraper
    newName: 192.168.45.116:5000/scraper
    newTag: "none"
replicas:
  - name: scraper
    count: 1
patches:
  - target: { kind: Deployment, name: scraper }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
  - target: { kind: Ingress, name: scraper }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: apps-dev.192.168.45.116.nip.io
